name: Build episode 014 Rosa narration
on:
  push:
    paths:
      - '.github/workflows/build-ep014-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble complete Rosa narration
        run: python3 .podcast/build_ep014.py
      - name: Save complete audio and fourteenth episode page
        run: |
          git config user.name 'suyeye6117-pixel'
          git config user.email '307068200+suyeye6117-pixel@users.noreply.github.com'
          git add assets/audio/ora-014-rosa.mp3 assets/audio/ora-014-rosa.json episodes/ora-014.html index.html
          git commit -m 'Publish episode 014 Rosa female narration'
          git pull --rebase origin main
          git push origin HEAD:main
