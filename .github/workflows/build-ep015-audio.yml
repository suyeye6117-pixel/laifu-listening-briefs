name: Build episode 015 Lucinda narration
on:
  push:
    paths:
      - '.github/workflows/build-ep015-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble complete Lucinda narration
        run: python3 .podcast/build_ep015.py
      - name: Save complete audio and fifteenth episode page
        run: |
          git config user.name 'suyeye6117-pixel'
          git config user.email '307068200+suyeye6117-pixel@users.noreply.github.com'
          git add assets/audio/ora-015-lucinda.mp3 assets/audio/ora-015-lucinda.json episodes/ora-015.html index.html
          git commit -m 'Publish episode 015 Lucinda female narration'
          git pull --rebase origin main
          git push origin HEAD:main
