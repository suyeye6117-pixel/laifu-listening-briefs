name: Build episode 004 audio
on:
  push:
    paths:
      - '.podcast/ep004-ready.json'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check FFmpeg
        run: ffmpeg -version
      - name: Assemble and validate complete dialogue
        run: python3 .podcast/build_ep004.py
      - name: Save audio and page
        run: |
          git config user.name 'suyeye6117-pixel'
          git config user.email '307068200+suyeye6117-pixel@users.noreply.github.com'
          git add assets/audio/ora-004-duet.mp3 assets/audio/ora-004-duet.json episodes/ora-004.html
          git commit -m 'Publish complete episode 004 dialogue audio'
          git push origin HEAD:main
