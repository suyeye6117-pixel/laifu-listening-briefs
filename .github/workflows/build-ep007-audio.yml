name: Build episode 007 Haoran narration
on:
  push:
    paths:
      - '.github/workflows/build-ep007-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble complete Haoran narration
        run: python3 .podcast/build_ep007.py
      - name: Save complete audio and seventh episode page
        run: |
          git config user.name 'suyeye6117-pixel'
          git config user.email '307068200+suyeye6117-pixel@users.noreply.github.com'
          git add assets/audio/ora-007-haoran.mp3 assets/audio/ora-007-haoran.json episodes/ora-007.html index.html
          git commit -m 'Publish episode 007 Haoran male narration'
          git pull --rebase origin main
          git push origin HEAD:main
